[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[project]
name = "superlm"
version = "0.6.0"
description = "SuperLM Model."
readme = "README.md"
authors = [
    { name = "bleuboat", email = "3751541788@qq.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
]

[tool]

[tool.pyright]
typeCheckingMode = "strict"
reportUnknownMemberType = false
ignore = ["**/*.in", ".venv/"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }

[tool.ruff]
line-length = 100
respect-gitignore = false
exclude = ["**/*.in", ".venv/"]

[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "BLE",
    "C4",
    "C90",
    "COM",
    "D",
    "DOC",
    "E",
    "EM",
    "F",
    "FBT",
    "FIX",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PGH",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T10",
    "TID",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "lowercase-imported-as-non-lowercase",  # why not: `import torch.nn.functional as F`
    "manual-from-import",                   # why not: `import torch.nn as nn`
    "non-augmented-assignment",             # why not: unsafe on Tensor
    "D1",                                   # why not: too much docstring
]
preview = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "numpy>=2.5.2",
    "ruff>=0.16.4",
]
